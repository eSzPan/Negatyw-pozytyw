name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autotools-dev \
            libtool \
            libtool-bin \
            libltdl-dev \
            gettext \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          # wyczyść stare cache buildozer, żeby libffi zbudowało się od nowa
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/libffi || true
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: konwerter-zdjec-apk
          path: bin/*.apk
          if-no-files-found: warn
